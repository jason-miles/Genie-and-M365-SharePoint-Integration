# Databricks Asset Bundle: SharePoint ingestion pipeline (Path B), custom Graph job (Path C),
# and the shared parse / index notebooks.
#
# Workspace auth comes from your CLI profile / environment:
#   databricks bundle validate -t dev --profile <profile>
#   databricks bundle deploy   -t dev --profile <profile>
bundle:
  name: sharepoint-rag

# Deploy ONLY the path(s) you use: `bundle deploy` creates every included resource.
#   Path B needs the SharePoint Unity Catalog connection to exist first (README, Path B step 4).
#   Path C needs graph_site_id set. Comment out the line you do not need.
include:
  - resources/option_b.yml   # Path B: Lakeflow Connect pipeline + job
  - resources/option_c.yml   # Path C: custom Graph job

variables:
  catalog:
    description: Unity Catalog catalog created by terraform (catalog_name)
    default: m365
  sharepoint_connection_name:
    description: Name of the SharePoint Unity Catalog connection created in Catalog Explorer
    default: sharepoint_m2m
  sharepoint_url:
    description: "Path B: site, subsite, drive or folder to ingest, e.g. https://<tenant>.sharepoint.com/sites/<site>"
    default: "https://CHANGE-ME.sharepoint.com/sites/CHANGE-ME"
  destination_table:
    description: Bronze table that receives the SharePoint files (Path B)
    default: sharepoint_files
  graph_site_id:
    description: "Microsoft Graph site ID for the custom pipeline (Path C); see scripts/get_site_id.sh"
    default: ""
  ops_email:
    description: On-call address for job failure notifications
  schedule_timezone:
    description: Quartz timezone id for the nightly schedule
    default: UTC
  vs_endpoint:
    description: Vector Search endpoint name (terraform output vector_search_endpoint)
    default: vs-sharepoint-dev

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    # Run prod as a service principal, never as a person:
    # run_as:
    #   service_principal_name: "<application-id>"
